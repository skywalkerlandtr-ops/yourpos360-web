<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sipariş ver · YourPOS 360</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E8590C">
<link rel="icon" href="/assets/img/ikon.svg" type="image/svg+xml">
<style>
:root{--ac:#E8590C;--ac2:#FF8A3D;--bg:#FFFAF6;--kart:#fff;--ink:#14161A;--sub:#5B606B;--hat:#ECE3DC;--tg:#229ED9;--golge:0 1px 2px rgba(20,22,26,.05),0 12px 32px rgba(20,22,26,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1014;--kart:#171A21;--ink:#F3F4F6;--sub:#A3A9B5;--hat:#262A33;--golge:none;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Color Emoji",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px));line-height:1.5}
.kart{width:100%;max-width:440px;background:var(--kart);border-radius:24px;box-shadow:var(--golge);padding:26px 20px;text-align:center}
.logo{width:76px;height:76px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:24px;line-height:1.25;margin-bottom:6px}
.alt{color:var(--sub);font-size:15px;margin-bottom:20px}
.sec{display:flex;flex-direction:column;gap:12px;text-align:left}
.sec a{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;text-decoration:none;color:inherit;border:2px solid var(--hat);transition:border-color .15s,transform .15s}
.sec a:hover{transform:translateY(-1px)}
.sec a.tg{border-color:var(--tg)}
.sec a.web{border-color:var(--ac)}
.sec .ik{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;color:#fff}
.sec .tg .ik{background:var(--tg)}
.sec .web .ik{background:var(--ac)}
.sec b{display:block;font-size:17px}
.sec span.s{color:var(--sub);font-size:14px}
.sec .ok{margin-left:auto;color:var(--sub);font-size:22px}
.not{margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(232,89,12,.1);color:var(--ink);font-size:14px;text-align:left}
.hatirla{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;color:var(--sub);font-size:14px}
.hatirla input{width:20px;height:20px;accent-color:var(--ac)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--ac);border-right-color:transparent;animation:d .8s linear infinite;margin:18px auto}
@keyframes d{to{transform:rotate(360deg)}}
.marka{margin-top:22px;color:var(--sub);font-size:13px;text-align:center}
.marka a{color:var(--ac);font-weight:700;text-decoration:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main class="kart" id="q">
  <div class="logo" id="logo" aria-hidden="true">🍽️</div>
  <h1 id="ad">Sipariş sayfası</h1>
  <p class="alt" id="altyazi">Açılıyor…</p>
  <div class="spin" id="yuk" role="status" aria-label="Yükleniyor"></div>
  <div class="sec" id="sec"></div>
  <label class="hatirla" id="hatirlaK" hidden><input type="checkbox" id="hatirla"> <span id="hatirlaY">Seçimimi bu telefonda hatırla</span></label>
  <p class="not" id="not" hidden></p>
</main>
<main class="kart" id="yok" hidden>
  <div class="logo" aria-hidden="true">?</div>
  <h1>Sayfa bulunamadı</h1>
  <p class="alt">Aradığınız sayfa taşınmış ya da hiç olmamış olabilir.</p>
  <div class="sec"><a class="web" href="/"><span class="ik">🏠</span><span><b>YourPOS 360 ana sayfa</b><span class="s">yourpos360.com</span></span><span class="ok">›</span></a></div>
</main>
<p class="marka">Sipariş sistemi: <a href="/">YourPOS 360</a> · komisyonsuz</p>
<script>
(function(){
  var APP = 'https://skywalkerlandtr-ops.github.io/yourpos360-app/', API = 'https://api.yourpos360.com/exec';
  // 1.30 · QR doğrudan sipariş sayfasını (menüyü) açar; seçim ekranı yalnız ?sor=1 ile ya da web siparişi kapalıysa görünür.
  // Daha önce «Telegram'dan sipariş ver» seçip «hatırla» diyen müşteri Telegram'a gider. Sayfa 9 dilde.
  // Adres biçimleri: /q/?b=<IsletmeID> (QR afişleri) · /q/?<IsletmeID> · /q/<IsletmeID>
  var yol = location.pathname.replace(/\/+$/, ''), pm = /^\/q\/([A-Za-z0-9_-]{1,64})$/.exec(yol), sq = new URLSearchParams(location.search);
  var b = pm ? pm[1] : (sq.get('b') || (/^\?[A-Za-z0-9_-]{1,64}$/.test(location.search) ? location.search.slice(1) : ''));
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return '&#' + c.charCodeAt(0) + ';'; }); };
  var DIL = (function(){ var q = sq.get('dil'), l = ['tr','en','ru','de','ar','es','th','vi','pt'], d;
    try { d = localStorage.getItem('yourpos360-dil'); } catch(e){}
    if (l.indexOf(q) >= 0) return q; if (l.indexOf(d) >= 0) return d;
    var n = String(navigator.language || '').toLowerCase().split(/[-_]/)[0]; return l.indexOf(n) >= 0 ? n : 'tr'; })();
  var M = {
    acil:['Açılıyor…','Opening…','Открывается…','Wird geöffnet…','جارٍ الفتح…','Abriendo…','กำลังเปิด…','Đang mở…','Abrindo…'],
    yok:['İşletme bulunamadı','Business not found','Заведение не найдено','Geschäft nicht gefunden','لم يتم العثور على المتجر','Negocio no encontrado','ไม่พบร้านค้า','Không tìm thấy cửa hàng','Estabelecimento não encontrado'],
    eski:['QR kodu eski ya da işletme kaldırılmış olabilir.','The QR code may be outdated or the business may have been removed.','QR-код устарел или заведение удалено.','Der QR-Code ist veraltet oder das Geschäft wurde entfernt.','قد يكون رمز QR قديمًا أو تمت إزالة المتجر.','El código QR puede estar desactualizado o el negocio ya no existe.','คิวอาร์โค้ดอาจเก่าหรือร้านค้าถูกนำออกแล้ว','Mã QR có thể đã cũ hoặc cửa hàng đã bị gỡ.','O QR code pode estar desatualizado ou o estabelecimento foi removido.'],
    nasil:['Nasıl sipariş vermek istersiniz?','How would you like to order?','Как вы хотите сделать заказ?','Wie möchten Sie bestellen?','كيف تريد أن تطلب؟','¿Cómo quieres pedir?','คุณต้องการสั่งซื้อแบบใด','Bạn muốn đặt hàng bằng cách nào?','Como você quer fazer o pedido?'],
    kapali:['Şu an kapalı · menüye göz atabilirsiniz','Closed now · you can browse the menu','Сейчас закрыто · можно посмотреть меню','Gerade geschlossen · Sie können das Menü ansehen','مغلق الآن · يمكنك تصفح القائمة','Cerrado ahora · puedes ver el menú','ปิดอยู่ตอนนี้ · ดูเมนูได้','Hiện đang đóng · bạn có thể xem thực đơn','Fechado agora · você pode ver o cardápio'],
    tg:["Telegram'dan sipariş ver",'Order on Telegram','Заказать в Telegram','Über Telegram bestellen','اطلب عبر Telegram','Pedir por Telegram','สั่งซื้อผ่าน Telegram','Đặt hàng qua Telegram','Pedir pelo Telegram'],
    tgS:['Telegram uygulaması açılır','Opens the Telegram app','Откроется приложение Telegram','Die Telegram-App wird geöffnet','سيفتح تطبيق Telegram','Se abre la app de Telegram','จะเปิดแอป Telegram','Ứng dụng Telegram sẽ mở','Abre o app do Telegram'],
    web:['Tarayıcıdan sipariş ver','Order in the browser','Заказать в браузере','Im Browser bestellen','اطلب من المتصفح','Pedir en el navegador','สั่งซื้อในเบราว์เซอร์','Đặt hàng trên trình duyệt','Pedir no navegador'],
    webS:['Uygulama gerekmez, bu telefonda açılır','No app needed, opens on this phone','Приложение не нужно, откроется на этом телефоне','Keine App nötig, öffnet sich auf diesem Telefon','لا حاجة لتطبيق، يفتح على هذا الهاتف','No necesitas app, se abre en este teléfono','ไม่ต้องใช้แอป เปิดบนโทรศัพท์เครื่องนี้','Không cần ứng dụng, mở ngay trên điện thoại này','Não precisa de app, abre neste telefone'],
    almiyor:['Bu işletme şu an sipariş almıyor.','This business is not taking orders right now.','Сейчас заведение не принимает заказы.','Dieses Geschäft nimmt gerade keine Bestellungen an.','لا يستقبل هذا المتجر طلبات حاليًا.','Este negocio no acepta pedidos ahora.','ร้านนี้ยังไม่รับคำสั่งซื้อในขณะนี้','Cửa hàng này hiện không nhận đơn.','Este estabelecimento não está recebendo pedidos agora.'],
    hatirla:['Seçimimi bu telefonda hatırla','Remember my choice on this phone','Запомнить выбор на этом телефоне','Meine Auswahl auf diesem Telefon merken','تذكّر اختياري على هذا الهاتف','Recordar mi elección en este teléfono','จำตัวเลือกของฉันในโทรศัพท์เครื่องนี้','Ghi nhớ lựa chọn trên điện thoại này','Lembrar minha escolha neste telefone']
  };
  var t = function(k){ var i = ['tr','en','ru','de','ar','es','th','vi','pt'].indexOf(DIL); return (M[k] && M[k][i]) || M[k][0]; };
  document.documentElement.lang = DIL; if (DIL === 'ar') document.documentElement.dir = 'rtl';
  $('#altyazi').textContent = t('acil'); $('#hatirlaY').textContent = t('hatirla');
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(b)) { $('#q').hidden = true; $('#yok').hidden = false; return; }
  var demo = b === 'ornek', sor = sq.get('sor') === '1';
  var webUrl = APP + 'index.html?' + (demo ? 'demo=1' : 'b=' + encodeURIComponent(b) + '&web=1') + (sq.get('dil') ? '&dil=' + DIL : '');
  var KEY = 'yp360-q-' + b, LS = { get:function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set:function(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
  var gitti = false;
  function git(u){ if (gitti) return; gitti = true; location.replace(u); }
  function tgUrl(r){ return r && r.bot && !r.telegramsiz ? 'https://t.me/' + encodeURIComponent(r.bot) + '?start=qr' : ''; }
  // seçim ekranı: ?sor=1 ya da web siparişi kapalı
  function secim(r){
    var ad = r.ad || '', tu = tgUrl(r);
    document.title = (ad || 'YourPOS 360') + ' · YourPOS 360';
    $('#logo').innerHTML = r.logoResim ? '<img src="' + esc(r.logoResim) + '" alt="">' : esc(r.logo || (ad.trim().split(/\s+/).slice(0, 2).map(function(w){ return w.charAt(0); }).join('').toLocaleUpperCase('tr-TR') || '🍽️'));
    $('#ad').textContent = ad;
    var h = '';
    if (tu) h += '<a class="tg" href="' + esc(tu) + '" data-sec="tg"><span class="ik">✈️</span><span><b>' + esc(t('tg')) + '</b><span class="s">' + esc(t('tgS')) + '</span></span><span class="ok">›</span></a>';
    if (r.web !== false) h += '<a class="web" href="' + esc(webUrl) + '" data-sec="web"><span class="ik">🌐</span><span><b>' + esc(t('web')) + '</b><span class="s">' + esc(t('webS')) + '</span></span><span class="ok">›</span></a>';
    $('#sec').innerHTML = h || '<p class="alt">' + esc(t('almiyor')) + '</p>';
    $('#yuk').hidden = true;
    $('#altyazi').textContent = r.acik === false ? t('kapali') : t('nasil');
    $('#hatirlaK').hidden = !(tu && r.web !== false);
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('[data-sec]');
    if (a) LS.set(KEY, $('#hatirla').checked ? a.getAttribute('data-sec') : '');
  });
  function karar(r){
    if (sor || r.web === false) { secim(r); return; }
    if (LS.get(KEY) === 'tg' && tgUrl(r)) { git(tgUrl(r)); return; }   // müşterinin daha önceki seçimi
    git(webUrl);
  }
  if (demo) { karar({ ad:'Örnek Dönerci', bot:'yourpos360_bot', web:true, acik:true }); return; }
  // Sunucu geç kalırsa beklemeden sipariş sayfası açılır (sayfa kendi bağlantısını dener)
  var zaman = setTimeout(function(){ if (!sor) git(webUrl); }, LS.get(KEY) === 'tg' ? 4000 : 2500);
  fetch(API + '?api=1', { method:'POST', body:JSON.stringify({ act:'webIsletme', b:b }) }).then(function(r){ return r.json(); }).then(function(r){
    if (gitti) return;
    clearTimeout(zaman);
    if (!r || !r.ok) { $('#yuk').hidden = true; $('#ad').textContent = t('yok'); $('#altyazi').textContent = t('eski'); $('#sec').innerHTML = ''; return; }
    karar(r);
  }).catch(function(){ if (!gitti) { clearTimeout(zaman); if (sor) secim({ web:true }); else git(webUrl); } });
})();
</script>
</body>
</html>
